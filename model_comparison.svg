<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="515" viewBox="0 0 1120 515" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Life Expectancy Prediction: Model Comparison</title><desc id="chartdesc">Mean absolute error in years: Random Forest 2.328, Linear Regression 3.321, Baseline 6.166. Lower is better.</desc><rect width="1120" height="515" fill="#f8fafc"/><rect x="30" y="25" width="1060" height="463" rx="20" fill="#ffffff" stroke="#e2e8f0"/><text x="80" y="85" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="bold" fill="#0f172a">How Accurately Can We Predict Life Expectancy?</text><text x="82" y="123" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#64748b">Mean absolute error (MAE), years • Test period: 2020–2022</text><text x="85" y="211" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#334155">Random Forest</text><rect x="300" y="182" width="216.2" height="45" rx="8" fill="#1b7a73"/><text x="531.2" y="211" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">2.328</text>
