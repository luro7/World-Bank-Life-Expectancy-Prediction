<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">Random forest model reduces prediction error compared with linear regression and mean baseline</title><desc id="desc">Mean absolute error measured in years: baseline 6.166, linear regression 3.321, random forest 2.328. Lower is better.</desc><rect width="1120" height="510" fill="#f8fafc"/><rect x="16" y="16" width="1088" height="478" rx="24" fill="#fff" stroke="#dce7ef"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0f2743">How accurately can models estimate life expectancy?</text><text x="60" y="106" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Mean absolute error in years, held-out 2020–2022 (lower is better)</text><text x="60" y="205" font-family="Arial,sans-serif" font-size="21" fill="#1f3b55">Mean baseline</text><rect x="300" y="175" rx="9" width="610.4" height="45" fill="#94a3b8"/><text x="932.4" y="205" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f2743">6.166</text><text x="60" y="297" font-family="Arial,sans-serif" font-size="21" fill="#1f3b55">Linear regression</text><rect x="300" y="267" rx="9" width="328.8" height="45" fill="#5c8bb5"/><text x="650.8" y="297" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f2743">3.321</text><text x="60" y="389" font-family="Arial,sans-serif" font-size="21" fill="#1f3b55">Random forest</text><rect x="300" y="359" rx="9" width="230.5" height="45" fill="#0d9184"/><text x="552.5" y="389" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f2743">2.328</text><text x="60" y="473" font-family="Arial,sans-serif" font-size="17" fill="#64748b">Random forest reduced average error by 29.9% versus linear regression.</text></svg>